services:
  trip-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: trip-service:lab1
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env.example
    environment:
      HTTP_ADDR: ":8080"
      # localhost внутри контейнера — это сам контейнер. Порт берётся из tripgoctl connect.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the tripgoctl Postgres URL with host host.docker.internal}
      IDEMPOTENCY_TTL: ${IDEMPOTENCY_TTL:-24h}
